# Docker Compose file for Farah-Faiza Next.js application
# This defines the web service that matches the deployment workflow

services:
  web:
    image: ShaafDev/terriblemistake:latest
    environment:
      NODE_ENV: production
      # Supabase configuration - these should be set in your server environment
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # Also support the public format for client-side access
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
    ports:
      - "80:3000"
    restart: unless-stopped


