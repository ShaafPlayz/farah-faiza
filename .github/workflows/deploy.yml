name: deploy this terriblemistake

on:
    push:
        branches:
            - deployed

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Check Repo
              uses: actions/checkout@v4
            
            - name: DockerHub Login
              uses: docker/login-action@v3
              with:
                  username: ${{secrets.DOCKER_USERNAME}}
                  password: ${{secrets.DOCKER_TOKEN}}

            - name: Build and Push to DockerHub
              run: |
                  docker build -t ${{secrets.DOCKER_USERNAME}}/terriblemistake:latest ./
                  docker push ${{secrets.DOCKER_USERNAME}}/terriblemistake:latest

            - name: SSH Setup
              uses: webfactory/ssh-agent@v0.8.0
              with:
                  ssh-private-key: ${{secrets.SSH_PRIVATE_KEY}}

            - name: I know this VPS
              run: |
                  ssh-keyscan -H ${{secrets.VPS_IP}} >> ~/.ssh/known_hosts
            
            - name: Deploy this terriblemistake
              run: |
                  ssh ${{secrets.VPS_USERNAME}}@${{secrets.VPS_IP}} "cd ~/farah-faiza && git pull origin deployed && docker compose -f compose.yml up web -d"